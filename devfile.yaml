schemaVersion: 2.2.0
metadata:
  name: pelorus-workspace
projects:
  - name: pelorus
    git:
      checkoutFrom:
        remote: upstream
        revision: main
      remotes:
        upstream: https://github.com/dora-metrics/pelorus.git
  - name: pelorus-api
    git:
      checkoutFrom:
        remote: upstream
        revision: main
      remotes:
        upstream: https://github.com/dora-metrics/pelorus-api.git
  - name: pelorus-ui
    git:
      checkoutFrom:
        remote: upstream
        revision: main
      remotes:
        upstream: https://github.com/dora-metrics/pelorus-ui.git
  - name: dev-workspace
    git:
      checkoutFrom:
        remote: upstream
        revision: main
      remotes:
        upstream: https://github.com/dora-metrics/dev-workspace.git
components:
- name: dev-tools
  container: 
    image: quay.io/redhat-cop/devspaces-java21-node20-python311
    memoryLimit: 6Gi
    mountSources: true
    env:
    - name: SHELL
      value: "/bin/zsh"
    - name: HISTFILE
      value: "/projects/home/.sh_history"
    - name: VSCODE_DEFAULT_WORKSPACE
      value: "/projects/dev-workspace/pelorus.code-workspace"
    volumeMounts:
    - name: m2
      path: /home/user/.m2
    - name: npm
      path: /home/user/.npm
    endpoints:
      - exposure: public
        protocol: https
        name: pelorus-metrics
        targetPort: 3000
      - exposure: public
        protocol: https
        name: pelorus-api
        targetPort: 8080
      - exposure: internal
        protocol: https
        name: quarkus-debug
        targetPort: 5005
- name: tools
  container:
    image: quay.io/devfile/universal-developer-image:ubi10-latest
    mountSources: true
    memoryLimit: 4G
- volume:
    size: 10Gi
  name: projects
- volume:
    size: 2Gi
  name: m2
- volume:
    size: 2Gi
  name: npm
- name: oc-cli
  container:
    args:
      - '-c'
      - >-
        mkdir -p /projects/bin && cp /usr/bin/oc /projects/bin/oc && cp /usr/bin/kubectl /projects/bin/kubectl
    command:
      - /bin/bash
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    sourceMapping: /projects
    mountSources: true
    memoryLimit: 256M
commands:
- apply:
    component: oc-cli
    label: Copy OpenShift CLI
  id: cp-oc-cli
- exec:
    commandLine: ". ${PROJECTS_ROOT}/env-tmp/set-env.sh ; export NODE_EXTRA_CA_CERTS=/tmp/node-extra-certificates/ca.crt ; npm run dev"
    component: dev-tools
    workingDir: "${PROJECTS_ROOT}/pelorus-ui"
    label: "Pelorus UI Dev Mode"
  id: dev-intel-run
- exec:
    commandLine: ". ${PROJECTS_ROOT}/env-tmp/set-env.sh ; quarkus dev -Dquarkus.analytics.disabled=true -Dquarkus.tls.trust-all=true -Dquarkus.http.host=0.0.0.0"
    component: dev-tools
    workingDir: "${PROJECTS_ROOT}/pelorus-api"
    label: "Pelorus API Dev Mode"
  id: pelorus-api-run
- exec:
    commandLine: "nohup ./dev-init/env-init.sh > ${PROJECTS_ROOT}/env-init.log 2>&1 &"
    component: dev-tools
    workingDir: "${PROJECTS_ROOT}/dev-workspace"
  id: init-env
- id: gcloud-init
  exec:
    label: "1. Google Cloud CLI - Initialization"
    commandLine: gcloud init --console-only
    component: tools

- id: gcloud-auth-login
  exec:
    label: "2. Google Cloud CLI - Set up default authentication"
    commandLine: gcloud auth application-default login --no-launch-browser
    component: tools

- id: gcloud-auth-set-quota-project
  exec:
    label: "3. Google Cloud CLI - Set Quota Project"
    commandLine: gcloud auth application-default set-quota-project cloudability-it-gemini
    component: tools

- id: create-gcloud-adc-secret
  exec:
    label: "4. Create Google Cloud ADC Secret"
    commandLine: |
      kubectl create secret generic gcloud-adc --from-file=adc.json=$HOME/.config/gcloud/application_default_credentials.json && \
      kubectl label secret gcloud-adc controller.devfile.io/mount-to-devworkspace=true controller.devfile.io/watch-secret=true --overwrite
    component: tools

- id: annotate-gcloud-adc-secret
  exec:
    label: "5. Annotate Google Cloud ADC Secret"
    commandLine: |
      kubectl annotate secret gcloud-adc controller.devfile.io/mount-path=/credentials controller.devfile.io/mount-as=file --overwrite
    component: tools

- id: setup-environment-variables
  exec:
    label: "6. Set up environment variables ConfigMap"
    commandLine: |
      source scripts/setup-claude-vertex-env.sh
    component: dev-tools

- id: annotate-environment-variables
  exec:
    label: "7. Annotate environment variables ConfigMap"
    commandLine: |
      kubectl annotate configmap ai-tools-env controller.devfile.io/mount-as=env --overwrite
    component: tools

- id: install-claude
  exec:
    label: 8. Install Claude CLI (Optional)
    commandLine: curl -fsSL https://claude.ai/install.sh -o claude-install.sh && chmod +x claude-install.sh && ./claude-install.sh
    component: tools

- id: add-dataverse-mcp
  exec:
    label: 9. Add Dataverse MCP (Optional)
    commandLine: claude mcp add --transport http dataverse https://mcp.dataverse.redhat.com/mcp/
    component: tools

events:
  preStart:
    - cp-oc-cli
  postStart:
    - init-env
